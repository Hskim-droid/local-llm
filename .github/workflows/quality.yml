name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gramapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: gramapp/go.mod
          cache: true
          cache-dependency-path: gramapp/go.mod
      - name: Run Go tests
        run: go test ./...

  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-harness
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-harness/requirements-fixture.txt
      - name: Install fixture dependencies
        run: python -m pip install -r requirements-fixture.txt
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run harness tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check whitespace
        run: git diff --check
