<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340">
  <rect width="720" height="340" rx="10" fill="#0c0c0c"/>
  <rect width="720" height="32" rx="10" fill="#1f1f1f"/>
  <rect y="22" width="720" height="10" fill="#1f1f1f"/>
  <circle cx="18" cy="16" r="5" fill="#c42b1c"/>
  <text x="36" y="21" font-family="Segoe UI, sans-serif" font-size="12" fill="#ddd">local-llm</text>
  <text x="16" y="58" font-family="Consolas, Menlo, monospace" font-size="13" fill="#c8c8c8">════════════════════════════════════════</text>
  <text x="16" y="78" font-family="Consolas, Menlo, monospace" font-size="13" fill="#eee">  local-llm  0.8.9</text>
  <text x="16" y="98" font-family="Consolas, Menlo, monospace" font-size="13" fill="#c8c8c8">  Runs only on this PC. Files do not leave the machine.</text>
  <text x="16" y="118" font-family="Consolas, Menlo, monospace" font-size="13" fill="#c8c8c8">════════════════════════════════════════</text>
  <text x="16" y="150" font-family="Consolas, Menlo, monospace" font-size="14" fill="#fff">Right now you can do Report, Minutes, Translation.</text>
  <text x="16" y="178" font-family="Consolas, Menlo, monospace" font-size="13" fill="#ddd">  1) Report        — slides, sheets, Word, HWPX, web, video</text>
  <text x="16" y="200" font-family="Consolas, Menlo, monospace" font-size="13" fill="#ddd">  2) Minutes       — transcripts, slides, sheets, web</text>
  <text x="16" y="222" font-family="Consolas, Menlo, monospace" font-size="13" fill="#ddd">  3) Translation   — into the UI language; say a target to change it</text>
  <text x="16" y="250" font-family="Consolas, Menlo, monospace" font-size="13" fill="#9ad">  Type quit to exit.</text>
  <text x="16" y="286" font-family="Consolas, Menlo, monospace" font-size="14" fill="#7f7">&gt; _</text>
</svg>
